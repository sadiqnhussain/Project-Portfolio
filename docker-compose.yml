services:
  web:
    build: .
    ports: [ "8000:8000" ]
    env_file: .env
    volumes: [ "media:/app/media" ]
    depends_on: [ db ]
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
    volumes: [ "postgres_data:/var/lib/postgresql/data" ]
volumes:
  postgres_data:
  media:
